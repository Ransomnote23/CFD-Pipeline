async function importInvoiceCSV(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=async ev=>{
    try{
      const lines=ev.target.result.split('\n').filter(l=>l.trim());
      if(lines.length<2){alert('File is empty or has no data rows.');return;}
      const headers=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,'').toLowerCase());
      const idx=h=>headers.indexOf(h);
      const parsed=[];
      for(let i=1;i<lines.length;i++){
        const cols=parseCSVLine(lines[i]);
        const invNum=cols[idx('invoice_number')]?.trim();
        if(!invNum)continue;
        const customer=cols[idx('customer')]?.trim()||'';
        const amount=parseFloat(cols[idx('amount')])||0;
        if(!customer||!amount)continue;
        parsed.push({
          invoiceNumber:invNum,customer,poId:'',
          soNumber:cols[idx('so_number')]?.trim()||'',
          issueDate:cols[idx('issue_date')]?.trim()||'',
          dueDate:cols[idx('due_date')]?.trim()||'',
          amount,notes:cols[idx('notes')]?.trim()||'',
          paid:cols[idx('paid')]?.trim().toUpperCase()==='Y',
          paidDate:cols[idx('paid_date')]?.trim()||'',
          paidAmount:cols[idx('paid_amount')]?.trim()?parseFloat(cols[idx('paid_amount')]):null,
          paidNotes:cols[idx('paid_notes')]?.trim()||'',
          _cpo:cols[idx('cpo')]?.trim()||'',
        });
      }
      if(!parsed.length){alert('No valid rows found. Check that invoice_number, customer, and amount columns are present.');return;}
      parsed.forEach(inv=>{
        if(inv._cpo){
          const match=pos.find(p=>p.cpo===inv._cpo||p.id===inv._cpo);
          if(match){inv.poId=match.id;if(!inv.soNumber)inv.soNumber=match.so||'';}
        }
        delete inv._cpo;
      });
      const existingNums=new Set(invoices.map(i=>i.invoiceNumber));
      const toAdd=parsed.filter(i=>!existingNums.has(i.invoiceNumber));
      const dupes=parsed.filter(i=>existingNums.has(i.invoiceNumber));
      const missingDates=toAdd.filter(i=>!i.issueDate);
      if(!toAdd.length){alert(`All ${parsed.length} invoice(s) already exist.`);e.target.value='';return;}
      let confirmMsg=`Ready to import ${toAdd.length} invoice(s)`;
      if(dupes.length) confirmMsg+=`, skipping ${dupes.length} duplicate(s)`;
      if(missingDates.length) confirmMsg+=`.\n\n⚠ ${missingDates.length} invoice(s) have no date — use the bulk date editor after import`;
      if(!confirm(confirmMsg+'\n\nProceed?')){e.target.value='';return;}
      setStatus('loading','Importing...');
      let done=0,errs=0;
      for(const inv of toAdd){
        try{const saved=await dbSaveInvoice(inv);invoices.unshift(mapInvoice(saved));done++;}
        catch(err){errs++;console.error('Invoice import error',inv.invoiceNumber,err);}
      }
      setStatus('ok','● Live');
      e.target.value='';
      currentTab='invoices';
      document.querySelectorAll('.sidebar-item').forEach(el=>el.classList.remove('active'));
      renderContent();
      const stillMissing=invoices.filter(i=>!i.issueDate);
      if(stillMissing.length>0){
        setTimeout(()=>{
          alert(`Imported ${done} invoice${done!==1?'s':''}${errs?` (${errs} failed)`:''}.\n\n${stillMissing.length} invoice${stillMissing.length!==1?'s':''} are missing dates — the bulk date editor will open now.`);
          showBulkDateEdit();
        },200);
      } else {
        alert('Imported '+done+' invoice'+(done!==1?'s':'')+(errs?' ('+errs+' failed)':'')+' successfully.');
      }
    }catch(err){setStatus('err','✕ Import error');alert('Error: '+err.message);console.error(err);e.target.value='';}
  };
  r.readAsText(file);
}

function setAllIssueDates(){

async function saveBulkDates(){
  const missing=invoices.filter(i=>!i.issueDate);
  let saved=0,skipped=0,errs=0;
  for(const inv of missing){
    const issueEl=document.getElementById('bde-issue-'+inv.id);
    if(!issueEl?.value){skipped++;continue;}
    inv.issueDate=issueEl.value;
    const dueEl=document.getElementById('bde-due-'+inv.id);
    if(dueEl?.value){inv.dueDate=dueEl.value;}
    else{const d=new Date(inv.issueDate);d.setDate(d.getDate()+30);inv.dueDate=d.toISOString().slice(0,10);}
    try{await dbSaveInvoice(inv);saved++;}
    catch(err){errs++;console.error(err);}
  }
  closeModal();renderInvoices();
  alert(`Updated ${saved} invoice${saved!==1?'s':''}${skipped?`, skipped ${skipped} (no date entered)`:''}${errs?`, ${errs} error(s)`:''}.`);
}

async function renameCustomer(oldName,newName){
  newName=newName.trim();if(!newName||newName===oldName)return;
  const alreadyExists=customers.find(c=>c.name===newName);
  if(alreadyExists){if(!confirm(`"${newName}" already exists. Merge all POs from "${oldName}" into "${newName}"?`))return;}
  const {error}=await sb.from('pos').update({customer:newName}).eq('customer',oldName);
  if(error){alert('Error: '+error.message);return;}
  pos.forEach(p=>{if(p.customer===oldName)p.customer=newName;});
  if(!alreadyExists){await dbSaveCustomer(newName);customers.push({name:newName});}
  await dbDeleteCustomer(oldName);
  customers=customers.filter(c=>c.name!==oldName);
  customers.sort((a,b)=>a.name.localeCompare(b.name));
  renderLists();
}
async function deleteCustomer(name){
  if(pos.some(p=>p.customer===name)){alert(`Cannot delete "${name}" — active POs exist.`);return;}
  if(!confirm(`Delete "${name}"?`))return;
  await dbDeleteCustomer(name);customers=customers.filter(c=>c.name!==name);renderLists();
}
async function addCustomer(){
  const name=document.getElementById('new-cust-input')?.value.trim();
  if(!name){alert('Enter a name.');return;}
  if(customers.find(c=>c.name===name)){alert('Already exists.');return;}
  await dbSaveCustomer(name);customers.push({name});customers.sort((a,b)=>a.name.localeCompare(b.name));renderLists();
}
async function deleteSku(desc){
  if(!confirm(`Remove "${desc}"?`))return;
  await dbDeleteSku(desc);skus=skus.filter(s=>s.desc!==desc);renderLists();
}
async function addSku(){
  const desc=document.getElementById('new-sku-desc')?.value.trim();
  const unit=document.getElementById('new-sku-unit')?.value.trim()||'ea';
  const unitPrice=parseFloat(document.getElementById('new-sku-price')?.value)||0;
  const laborHours=parseFloat(document.getElementById('new-sku-labor')?.value)||0;
  if(!desc){alert('Enter a description.');return;}
  if(skus.find(s=>s.desc===desc)){alert('Already exists.');return;}
  await dbSaveSku({desc,unit,unitPrice,laborHours});
  skus.push({desc,unit,unitPrice,laborHours});
  renderLists();
}
async function updateSkuByIdx(i,field,val){
  const s=skus[i];if(!s)return;
  s[field]=val;
  try{await dbSaveSku(s);}
  catch(e){console.error('SKU save error',e);}
}
async function deleteSkuByIdx(i){
  const s=skus[i];if(!s)return;
  if(!confirm(`Remove "${s.desc}"?`))return;
  await dbDeleteSku(s.desc);skus.splice(i,1);renderLists();
}

function updateFulfillTotal(){
  let total=0;
  document.querySelectorAll('.fulfill-qty').forEach(input=>{
    const qty=Math.min(parseInt(input.value)||0, parseInt(input.dataset.open)||0);
    const unitPrice=parseFloat(input.dataset.unitPrice)||0;
    const lineTotal=qty*unitPrice;
    total+=lineTotal;
    const lineId=input.dataset.lineId;
    const el=document.getElementById('fulfill-line-val-'+lineId);
    if(el) el.textContent=fmt(lineTotal);
  });
  const totalEl=document.getElementById('fulfill-total');
  if(totalEl) totalEl.textContent=fmt(total);
}

async function submitFulfillPO(){
  const po=pos.find(p=>p.id===_addPoId);if(!po)return;
  const shipDate=document.getElementById('m-ship-date').value;
  const invNum=document.getElementById('m-inv-num').value.trim();
  const btn=document.getElementById('fulfill-btn');
  if(btn){btn.disabled=true;btn.textContent='Saving...';}

  // Collect line quantities
  const linesToShip=[];
  let invoiceTotal=0;
  let hasError=false;

  document.querySelectorAll('.fulfill-qty').forEach(input=>{
    const qty=parseInt(input.value)||0;
    const lineId=input.dataset.lineId;
    const unitPrice=parseFloat(input.dataset.unitPrice)||0;
    const openQty=parseInt(input.dataset.open)||0;
    if(qty<0||qty>openQty){hasError=true;return;}
    if(qty>0){
      linesToShip.push({lineId,qty,unitPrice});
      invoiceTotal+=qty*unitPrice;
    }
  });

  if(hasError){alert('One or more quantities are invalid.');if(btn){btn.disabled=false;btn.textContent='Record shipment';}return;}
  if(!linesToShip.length){alert('Enter a quantity greater than 0 for at least one line.');if(btn){btn.disabled=false;btn.textContent='Record shipment';}return;}

  try{
    // Save a shipment record for each line
    for(const item of linesToShip){
      const l=po.lines.find(x=>x.id===item.lineId);if(!l)continue;
      const sh={date:shipDate,qty:item.qty,inv:invNum};
      await dbSaveShipment(po.id,item.lineId,sh);
      l.shipped.push(sh);
    }

    // Create ONE invoice record for the whole batch if invoice# provided
    if(invNum){
      const existing=invoices.find(i=>i.invoiceNumber===invNum);
      const issueDate=shipDate||new Date().toISOString().slice(0,10);
      const due=new Date(issueDate);due.setDate(due.getDate()+30);
      const inv={
        id:existing?.id,
        invoiceNumber:invNum,
        customer:po.customer,
        poId:po.id,
        soNumber:po.so||'',
        issueDate,
        dueDate:due.toISOString().slice(0,10),
        amount:Math.round(invoiceTotal*100)/100,
        notes:'',
        paid:existing?.paid||false,
        paidDate:existing?.paidDate||'',
        paidAmount:existing?.paidAmount||null,
        paidNotes:existing?.paidNotes||''
      };
      const saved=await dbSaveInvoice(inv);
      if(existing){Object.assign(existing,mapInvoice(saved));}
      else{invoices.unshift(mapInvoice(saved));}
    }

    closeModal();renderContent();
  }catch(e){
    alert('Error saving: '+e.message);
    if(btn){btn.disabled=false;btn.textContent='Record shipment';}
  }
}

async function submitAddPO(){
  const cust=document.getElementById('m-cust').value.trim();
  const cpo=document.getElementById('m-cpo').value.trim();
  if(!cust||!cpo){alert('Customer and PO# are required.');return;}
  const btn=document.getElementById('add-po-btn');
  if(btn){btn.disabled=true;btn.textContent='Saving...';}
  const so=document.getElementById('m-so').value.trim();
  const wo=document.getElementById('m-wo').value.trim();
  const nums=pos.filter(p=>p.id.startsWith('PO-')).map(p=>parseInt(p.id.replace('PO-',''))||0);
  const id='PO-'+String((Math.max(0,...nums)+1)).padStart(3,'0');
  const newPO={id,customer:cust,cpo,rcvd:document.getElementById('m-rcvd').value,
    due:document.getElementById('m-due').value,commitDate:document.getElementById('m-commit').value,
    so,wo,cin7:!!so,fb:!!wo,inherited:document.getElementById('m-inherited').checked,
    notes:document.getElementById('m-notes').value.trim(),lines:[]};

  // Collect inline lines from modal
  const lineRows=document.querySelectorAll('[id^="po-line-row-"]');
  const pendingLines=[];
  lineRows.forEach(row=>{
    const descEl=row.querySelector('.po-line-desc');
    const desc=descEl?.value.trim();
    if(!desc)return;
    const idx=row.id.replace('po-line-row-','');
    const qty=parseInt(document.getElementById('po-line-qty-'+idx)?.value)||1;
    const unitPrice=parseFloat(document.getElementById('po-line-price-'+idx)?.value)||0;
    const unit=document.getElementById('po-line-unit-'+idx)?.value||'ea';
    pendingLines.push({id:'L'+(pendingLines.length+1),desc,qty,unit,unitPrice,shipped:[]});
  });
  newPO.lines=pendingLines;

  try{
    await dbSavePO(newPO);
    // Save lines to DB
    for(let i=0;i<pendingLines.length;i++){
      await dbSaveLine(newPO.id,pendingLines[i],i);
    }
    pos.push(newPO);
    await syncListsFromPos([newPO]);
    _poLineCount=0;
    expanded[id]=true;
    closeModal();renderContent();
  }catch(e){alert('Error: '+e.message);if(btn){btn.disabled=false;btn.textContent='Add PO';}}
}

async function submitAddLine(){
  const po=pos.find(p=>p.id===_addPoId);if(!po)return;
  const desc=document.getElementById('m-desc').value.trim();
  if(!desc){alert('Description is required.');return;}
  const unit=document.getElementById('m-unit').value||'ea';
  const unitPrice=parseFloat(document.getElementById('m-price').value)||0;
  const ids=po.lines.map(l=>parseInt(l.id.replace('L',''))||0);
  const line={id:'L'+(Math.max(0,...ids,0)+1),desc,qty:parseInt(document.getElementById('m-qty').value)||1,unit,unitPrice,shipped:[]};
  try{
    await dbSaveLine(po.id,line,po.lines.length);
    po.lines.push(line);
    if(document.getElementById('m-savesku')?.checked) await syncListsFromPos([{customer:po.customer,lines:[line]}]);
    closeModal();renderContent();
  }catch(e){alert('Error: '+e.message);}
}

// ── CSV import/export ──────────────────────────────────────────
function exportCSV(){
  const rows=[['PO ID','Customer','Customer PO#','Date Received','Due Date','Committed Date','Cin7 SO#','FB WO#','Inherited','Notes','Line ID','Description','Ordered Qty','Unit','Unit Price','Line Value','Shipped Qty','Shipped Value','Open Qty','Open Value','Invoice#s','Line Status']];
  pos.forEach(po=>po.lines.forEach(l=>{
    const shQ=lineShippedQty(l),openQ=lineOpenQty(l);
    const invs=[...new Set(l.shipped.filter(s=>s.inv).map(s=>s.inv))].join('; ');
    rows.push([po.id,`"${po.customer}"`,po.cpo,po.rcvd,po.due,po.commitDate,po.so,po.wo,po.inherited?'Y':'N',`"${po.notes||''}"`,l.id,`"${l.desc}"`,l.qty,l.unit,l.unitPrice,lineValue(l),shQ,lineShippedVal(l),openQ,openQ*l.unitPrice,invs,lineStatus(l)]);
  }));
  dl(rows.map(r=>r.join(',')).join('\n'),'pipeline_'+today()+'.csv','text/csv');
}

async function importCSV(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=async ev=>{
    try{
      const lines=ev.target.result.split('\n').filter(l=>l.trim());
      const headers=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
      const idx=h=>headers.indexOf(h);
      const poMap={};
      for(let i=1;i<lines.length;i++){
        const cols=parseCSVLine(lines[i]);if(cols.length<14)continue;
        const poId=cols[idx('po_id')]?.trim();if(!poId)continue;
        if(!poMap[poId]){
          poMap[poId]={id:poId,customer:cols[idx('customer')]?.trim()||'',
            cpo:cols[idx('cpo')]?.trim()||poId,rcvd:cols[idx('rcvd')]?.trim()||'',
            due:cols[idx('due')]?.trim()||'',commitDate:cols[idx('commitDate')]?.trim()||'',
            so:cols[idx('so')]?.trim()||'',wo:cols[idx('wo')]?.trim()||'',
            cin7:cols[idx('cin7')]?.trim()==='Y',fb:cols[idx('fb')]?.trim()==='Y',
            inherited:cols[idx('inherited')]?.trim()==='Y',
            notes:cols[idx('notes')]?.trim()||'',lines:[]};
        }
        const lineId=cols[idx('line_id')]?.trim();
        const lineDesc=cols[idx('line_desc')]?.trim();
        if(lineId&&lineDesc){
          const shQ=parseInt(cols[idx('shipped_qty')])||0;
          const invStr=cols[idx('invoices')]?.trim()||'';
          poMap[poId].lines.push({id:lineId,desc:lineDesc,
            qty:parseInt(cols[idx('qty')])||0,unit:cols[idx('unit')]?.trim()||'ea',
            unitPrice:parseFloat(cols[idx('unit_price')])||0,
            shipped:shQ>0?[{date:'',qty:shQ,inv:invStr}]:[]});
        }
      }
      const newPos=Object.values(poMap);
      if(!newPos.length){alert('No valid POs found.');return;}
      const existingIds=new Set(pos.map(p=>p.id));
      const toAdd=newPos.filter(p=>!existingIds.has(p.id));
      const dupes=newPos.filter(p=>existingIds.has(p.id));
      if(!toAdd.length){alert(`All ${newPos.length} PO(s) already exist.`);return;}
      setStatus('loading','Importing...');
      for(const po of toAdd){
        await dbSavePO(po);
        for(let i=0;i<po.lines.length;i++){
          await dbSaveLine(po.id,po.lines[i],i);
          for(const sh of po.lines[i].shipped){if(sh.qty>0)await dbSaveShipment(po.id,po.lines[i].id,sh);}
        }
      }
      pos=[...pos,...toAdd];
      await syncListsFromPos(toAdd);
      setStatus('ok','● Live');
      const msg=dupes.length?`Added ${toAdd.length} PO(s). Skipped ${dupes.length} duplicate(s): ${dupes.map(p=>p.cpo).join(', ')}.`:`Imported ${toAdd.length} PO(s) successfully.`;
      alert(msg);renderContent();
    }catch(err){setStatus('err','✕ Error');alert('Import error: '+err.message);console.error(err);}
  };
  r.readAsText(file);e.target.value='';
}

function parseCSVLine(line){
  const result=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
    else if(c===','&&!inQ){result.push(cur);cur='';}
    else cur+=c;
  }
  result.push(cur);return result;
}

// ── One-time migration from localStorage ──────────────────────
async function migrateFromLocalStorage(){
  const raw=localStorage.getItem('scp_pipeline_v1');
  if(!raw){alert('No local data found.');return;}
  let localPos;try{localPos=JSON.parse(raw);}catch{alert('Could not read local data.');return;}
  if(!localPos.length){alert('No POs found in local storage.');return;}
  if(!confirm(`Found ${localPos.length} POs in local storage. Migrate to database?`))return;
  const btn=document.getElementById('migrate-btn');
  const msg=document.getElementById('migrate-msg');
  if(btn)btn.disabled=true;
  const existingIds=new Set(pos.map(p=>p.id));
  const toMigrate=localPos.filter(p=>!existingIds.has(p.id));
  if(!toMigrate.length){if(msg)msg.textContent='All POs already exist in the database.';if(btn)btn.disabled=false;return;}
  let done=0,errs=0;
  for(const po of toMigrate){
    try{
      if(msg)msg.textContent=`Migrating ${done+1}/${toMigrate.length}...`;
      const cleanPO={...po,commitDate:po.commitDate||''};
      await dbSavePO(cleanPO);
      for(let i=0;i<(po.lines||[]).length;i++){
        const l=po.lines[i];
        await dbSaveLine(po.id,l,i);
        for(const sh of(l.shipped||[])){if(sh.qty>0)await dbSaveShipment(po.id,l.id,sh);}
      }
      pos.push({...cleanPO,lines:(po.lines||[]).map(l=>({...l,shipped:(l.shipped||[]).map(s=>({...s}))}))});
      done++;
    }catch(e){errs++;console.error('Migrate error',po.id,e);}
  }
  await syncListsFromPos(toMigrate);
  if(btn)btn.disabled=false;
  if(msg)msg.textContent=`Done — migrated ${done} POs${errs?`, ${errs} failed`:''}. `;
  renderContent();
}

function dl(content,filename,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type}));
  a.download=filename;a.click();
}
function today(){return new Date().toISOString().slice(0,10);}

// ── Open PO Report generator ───────────────────────────────────
function showReportModal(){
  const custOpts=customers.map(c=>`<option value="${escHtml(c.name)}">${escHtml(c.name)}</option>`).join('');
  document.getElementById('modal-area').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="max-width:480px;">
      <div class="modal-title">Generate Open PO Report</div>
      <p style="font-size:12px;color:var(--text3);margin-bottom:16px;line-height:1.6;">
        Creates an Excel workbook with a Summary and Detail tab per customer.<br>
        Only POs with open lines are included. Overdue rows are highlighted red.<br>
        Labor hours use a 1.2× safety factor applied to BOM hrs/unit.
      </p>
      <div class="modal-grid">
        <div class="full">
          <div class="field-label" style="margin-bottom:6px;">Customer scope</div>
          <select id="rpt-cust" style="width:100%;margin:0;">
            <option value="">All customers (one tab pair per customer)</option>
            ${custOpts}
          </select>
        </div>
      </div>
      <div class="modal-actions" style="margin-top:16px;">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="rpt-btn" onclick="generateReport()">Download report</button>
      </div>
      <div id="rpt-status" style="font-size:12px;color:var(--text3);margin-top:10px;min-height:16px;"></div>
    </div>
  </div>`;
}

function generateReport(){
  const custFilter=document.getElementById('rpt-cust')?.value||'';
  const btn=document.getElementById('rpt-btn');
  const status=document.getElementById('rpt-status');
  if(btn){btn.disabled=true;btn.textContent='Building…';}
  if(status) status.textContent='Sending data to report server…';

  // Build payload — only what the API needs
  const payload={
    customer: custFilter||null,
    data:{
      pos: pos.map(po=>({
        id:po.id, customer:po.customer, cpo:po.cpo,
        rcvd:po.rcvd, due:po.due, so:po.so, wo:po.wo,
        lines:po.lines.map(l=>({
          id:l.id, desc:l.desc, qty:l.qty,
          unit:l.unit, unitPrice:l.unitPrice,
          shipped:l.shipped.map(s=>({qty:s.qty,inv:s.inv,date:s.date}))
        }))
      })),
      skus: skus.map(s=>({desc:s.desc,laborHours:s.laborHours||0}))
    }
  };

  fetch('/api/report',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  })
  .then(res=>{
    if(!res.ok) return res.json().then(e=>{throw new Error(e.error||'Server error');});
    return res.blob();
  })
  .then(blob=>{
    const d=new Date();
    const ds=`${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    const fname=custFilter
      ?`${custFilter.replace(/[^a-zA-Z0-9]/g,'_')}_Open_PO_Report_${ds}.xlsx`
      :`All_Customers_Open_PO_Report_${ds}.xlsx`;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=fname; a.click();
    URL.revokeObjectURL(url);
    if(status) status.textContent=`✓ Downloaded: ${fname}`;
    if(btn){btn.disabled=false;btn.textContent='Download report';}
  })
  .catch(e=>{
    console.error(e);
    if(status) status.textContent='Error: '+e.message;
    if(btn){btn.disabled=false;btn.textContent='Download report';}
  });
}

function _reportDate(){
  const d=new Date();
  return `${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}
